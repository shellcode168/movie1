name: Infinity Movie Swarm 6-Node Render Farm
on:
  push:
    paths: ['tasks_queue/current_batch.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swarm-6nodes-worker:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node-id: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install --quiet PyGithub
      - name: Run Swarm Worker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NODE_INDEX: ${{ matrix.node-id }}
        run: python scripts/github_actions_worker.py
